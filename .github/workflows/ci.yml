name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENAS_RUN_CLAUDE_TESTS: "0"
      OPENAS_RUN_CLAUDE_LIFECYCLE: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Validate plugin metadata, references and task routing
        run: |
          python3 scripts/check_plugin.py
          python3 plugins/openas/workflows/task_router.py --task plugins/openas/workflows/examples/tiered-light-task.json
      - name: Install presentation test dependencies
        run: python3 -m pip install -r plugins/openas/skills/presentation-creation/requirements.txt
      - name: Python tests
        run: python3 -m unittest discover -s tests -v
      - name: Python workflow tests
        run: python3 -m unittest discover -s plugins/openas/workflows/tests -p 'test_*.py' -v
      - name: JavaScript workflow tests
        run: node plugins/openas/workflows/tests/agent-team.test.mjs

  windows-smoke:
    name: Windows workflow smoke
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Portable locks and timeout cancellation
        run: python -m unittest discover -s plugins/openas/workflows/tests -p test_portable_runtime.py -v
      - name: Memory, graph recovery, skills installation and workspace preparation
        run: python -m unittest discover -s plugins/openas/workflows/tests -p test_customer_workflows.py -v
      - name: Customer demo API and independent acceptance
        run: python -m unittest discover -s plugins/openas/workflows/tests -p test_customer_demo.py -v
      - name: CLI startup
        run: |
          python plugins/openas/workflows/codex-team.py --help
          python plugins/openas/workflows/graph-runner.py --help
          python plugins/openas/integrations/doctor.py --help
