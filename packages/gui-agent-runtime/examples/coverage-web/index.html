<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>OpenAS coverage fixture</title>
<h1>SIL coverage fixture</h1>
<button id="build">Build instrumented fixture</button>
<button id="test" disabled>Run SIL cases</button>
<p role="status" id="status">Ready</p>
<p><a id="report" download="coverage.json" hidden>Download MC/DC report</a></p>
<script>
  const build = document.getElementById('build');
  const test = document.getElementById('test');
  const status = document.getElementById('status');
  const report = document.getElementById('report');
  build.onclick = () => {
    build.disabled = true;
    test.disabled = false;
    status.textContent = 'Instrumented build ready';
  };
  test.onclick = () => {
    test.disabled = true;
    status.textContent = 'Running SIL cases';
    setTimeout(() => {
      const result = {suite: 'example-sil', build: 'instrumented', tests: 'passed', metric: 'MC/DC'};
      report.href = URL.createObjectURL(new Blob([JSON.stringify(result)], {type: 'application/json'}));
      report.hidden = false;
      status.textContent = 'SIL cases passed';
    }, 150);
  };
</script>
</html>
