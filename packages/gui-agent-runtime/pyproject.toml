[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "openas-gui-agent"
version = "0.1.0"
description = "Resumable desktop and browser goal agent runtime"
requires-python = ">=3.10"
[project.optional-dependencies]
browser = ["playwright>=1.49,<2"]
[project.scripts]
openas-gui = "openas_gui_agent.cli:main"
openas-benchmark = "openas_gui_agent.benchmark:main"
openas-experience = "openas_gui_agent.experience_cli:main"
[tool.setuptools.packages.find]
where = ["src"]
